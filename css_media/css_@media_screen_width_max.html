        /* ## 📱 `@media screen and (max-width)` trong CSS

`@media screen and (max-width: …)` dùng để **áp dụng CSS khi màn hình nhỏ hơn hoặc bằng một kích thước nhất định** — thường dùng cho **responsive mobile**.

---

# 🎯 Cú pháp

```css
@media screen and (max-width: 768px) {
  /* CSS áp dụng khi màn hình <= 768px */
/*}
```

👉 Nghĩa là:

* `screen` → áp dụng cho màn hình 📱💻
* `max-width: 768px` → khi chiều rộng ≤ 768px
* CSS bên trong sẽ chạy khi điều kiện đúng

---

# 📱 Ví dụ cơ bản

```css
.container {
  width: 1200px;
}

@media screen and (max-width: 768px) {
  .container {
    width: 100%;
  }
}
```

👉 Desktop → 1200px
👉 Mobile → 100%

---

# 🧩 Ví dụ ẩn menu trên mobile

```css
.navbar {
  display: flex;
}

@media screen and (max-width: 768px) {
  .navbar {
    display: none;
  }
}
```

---

# 📊 Breakpoints thường dùng

```css
/* mobile nhỏ */
/*@media screen and (max-width: 480px) {}

/* mobile */
/*@media screen and (max-width: 768px) {}

/* tablet */
/*@media screen and (max-width: 1024px) {}
```

---

# ⚠️ `screen` có bắt buộc không?

Không bắt buộc — bạn có thể viết:

```css
@media (max-width: 768px)
```

Hai cái này gần như giống nhau:

```css
@media screen and (max-width: 768px)
@media (max-width: 768px)
```

👉 Dev hiện đại thường bỏ `screen` cho gọn.

---

# 🧠 `max-width` vs `min-width`

### `max-width` (desktop-first)

```css
@media (max-width: 768px)
```

→ áp dụng cho màn hình nhỏ hơn

### `min-width` (mobile-first)

```css
@media (min-width: 768px)
```

→ áp dụng cho màn hình lớn hơn

---

# 🚀 Ví dụ hoàn chỉnh

```css
body {
  font-size: 18px;
}

/* tablet */
/*@media screen and (max-width: 1024px) {
  body {
    font-size: 16px;
  }
}

/* mobile */
/*@media screen and (max-width: 768px) {
  body {
    font-size: 14px;
  }
}
```

---

# 🧠 Nhớ nhanh

* `max-width` → nhỏ hơn 📉
* `min-width` → lớn hơn 📈
* `screen` → thiết bị màn hình
* dùng để responsive 📱

Bạn đang viết responsive theo:

* desktop-first (`max-width`)
* hay mobile-first (`min-width`)?
