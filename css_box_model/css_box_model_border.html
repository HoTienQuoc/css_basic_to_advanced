        /* # 96. Box Model – Border

**Border** là đường viền bao quanh **padding + content** của một element trong CSS Box Model. 📦

```
margin
 └─ border
     └─ padding
         └─ content
```

---

## 1. Border cơ bản

Border cần **3 thành phần**:

* width (độ dày)
* style (kiểu)
* color (màu)

```css
.box {
  border: 2px solid black;
}
```

---

## 2. Border shorthand

```css
border: width style color;
```

Ví dụ:

```css
.box {
  border: 3px dashed red;
}
```

---

## 3. Border riêng từng cạnh

```css
.box {
  border-top: 2px solid black;
  border-right: 3px dotted blue;
  border-bottom: 4px dashed red;
  border-left: 5px solid green;
}
```

---

## 4. Border width

```css
.box {
  border-width: 5px;
  border-style: solid;
}
```

Hoặc:

```css
border-width: 1px 2px 3px 4px;
```

(clockwise giống padding) 🕒

---

## 5. Border style

Các kiểu phổ biến:

```css
solid
dashed
dotted
double
groove
ridge
inset
outset
none
```

Ví dụ:

```css
.box {
  border: 4px dotted black;
}
```

---

## 6. Border color

```css
.box {
  border: 2px solid blue;
}
```

Hoặc riêng:

```css
border-color: red;
```

---

## 7. Border ảnh hưởng đến size box

Mặc định (`content-box`):

```css
.box {
  width: 200px;
  border: 10px solid black;
}
```

➡️ width thật = **220px**

```
200 + 10 + 10
```

---

## 8. Border radius (bo góc)

```css
.box {
  border: 2px solid black;
  border-radius: 10px;
}
```

Hình tròn:

```css
.circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
}
```

---

## 9. Border riêng từng thuộc tính

```css
.box {
  border-width: 2px;
  border-style: solid;
  border-color: black;
}
```

---

## 10. Border vs Outline

| Border           | Outline       |
| ---------------- | ------------- |
| nằm trong box    | nằm ngoài box |
| ảnh hưởng layout | không         |
| có radius        | không         |

---

## Ví dụ thực tế

Button:

```css
button {
  padding: 10px 20px;
  border: 2px solid black;
}
```

Card:

```css
.card {
  border: 1px solid #ddd;
  padding: 20px;
}
```

---

## Ghi nhớ nhanh

* border = đường viền 📦
* cần: width + style + color
* ảnh hưởng size box
* có thể bo góc với `border-radius` 🎯
