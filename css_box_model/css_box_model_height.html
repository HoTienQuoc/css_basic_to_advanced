        /* **90. Box model – `height`** xác định **chiều cao của content box** trong CSS Box Model 📦⬆️

---

## 🔹 `height` hoạt động giống `width`

👉 `height` **chỉ áp dụng cho phần content**, **không bao gồm padding và border** (mặc định).

```css
.box {
  height: 200px;
  padding: 20px;
  border: 5px solid black;
}
```

👉 Chiều cao thực tế:

```
200 (content)
+ 40 (padding top + bottom)
+ 10 (border top + bottom)
= 250px
```

---

## 🔹 Ví dụ cơ bản

```html
<div class="box">Content</div>
```

```css
.box {
  height: 150px;
  background: lightblue;
}
```

👉 Box cao cố định 150px

---

## 🔹 `height: auto` (mặc định)

```css
.box {
  height: auto;
}
```

👉 Chiều cao **tự động theo nội dung** 📏

---

## 🔹 `box-sizing` ảnh hưởng đến height

### `content-box` (default)

```css
.box {
  height: 200px;
  padding: 20px;
}
```

👉 tổng cao > 200px

### `border-box`

```css
.box {
  height: 200px;
  padding: 20px;
  box-sizing: border-box;
}
```

👉 tổng cao = 200px ⭐

---

## 🔹 `height` không áp dụng cho inline

```css
span {
  height: 100px; /* ❌ không hoạt động */
  /*
}
```

Fix:

```css
span {
  display: inline-block;
  height: 100px;
}
```

---

## 🔹 Các giá trị height phổ biến

```css
height: 200px;
height: 100%;
height: 100vh;
height: auto;
height: fit-content;
```

---

## 🔹 `height: 100%` cần parent có height

```css
.parent {
  height: 300px;
}

.child {
  height: 100%;
}
```

👉 `.child` = 300px

---

## 🔹 `height: 100vh`

```css
.hero {
  height: 100vh;
}
```

👉 Full chiều cao màn hình 🖥️

---

## 🔹 So sánh nhanh

| property     | ý nghĩa             |
| ------------ | ------------------- |
| `height`     | chiều cao cố định   |
| `min-height` | chiều cao tối thiểu |
| `max-height` | chiều cao tối đa    |

---

## 🔥 Best practice

```css
.container {
  min-height: 100vh;
}
```

👉 Layout full page nhưng vẫn co giãn theo content 📱

---

## 🧠 Quy tắc nhớ nhanh

* `height` = content only 📦
* dùng `min-height` thay vì `height` cho layout linh hoạt 🔄
* `100vh` = full screen 🖥️
