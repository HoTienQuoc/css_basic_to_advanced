<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css box model width</title>
    <style>
        /* box-model: width */
        section{
            width: 150px;
            background-color: blueviolet;
        }
        aside{
            width: 15rem;/* 15rem = 150px * 16px */
            background-color: teal;
        }
        p{
            width: 50%;
            background-color: yellow;
        }
        h1{
            width: 50%;
            background-color: royalblue;
        }
        span{
            width: 50%;
            background-color: rebeccapurple;
            display: table;
        }
        i{
            width: 50%;
            background-color: goldenrod;
        }
    </style>
</head>
<body>
    <section>Great</section>
    <aside>Dream</aside>
    <p>Friends</p>
    <h1>Dance</h1>
    <span>Happy</span>
    <i>Awesome</i>
    <h1>Sing</h1>
</body>
</html>
