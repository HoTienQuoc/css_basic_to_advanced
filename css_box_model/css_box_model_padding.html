        /* **Size box** trong CSS nghĩa là **kích thước tổng của một phần tử (element)** trên trang web. 📦

Nó không chỉ là `width` và `height`, mà còn bao gồm:

```
content + padding + border (+ margin*)
```

---

## Ví dụ

```css
.box {
  width: 200px;
  padding: 20px;
  border: 5px solid black;
}
```

👉 Kích thước thật của box sẽ là:

* content = 200px
* padding trái + phải = 40px
* border trái + phải = 10px

➡️ **Total width = 250px**

```
200 + 40 + 10 = 250px
```

---

## Minh họa box model

```
margin (ngoài cùng)
 └─ border
     └─ padding
         └─ content
```

---

## Có 2 kiểu tính size box

### 1. Mặc định (`content-box`)

```
width = content only
```

Padding và border **được cộng thêm** ➕

---

### 2. `border-box`

```css
box-sizing: border-box;
```

```
width = content + padding + border
```

👉 Tổng width **không đổi** 🎯

---

## Ví dụ dễ hiểu

### content-box (mặc định)

```css
width: 200px;
padding: 20px;
```

➡️ box thật = **240px**

### border-box

```css
width: 200px;
padding: 20px;
box-sizing: border-box;
```

➡️ box thật = **200px**

---

## Ghi nhớ nhanh

* size box = kích thước thật 📦
* bị ảnh hưởng bởi padding & border
* `box-sizing` quyết định cách tính

Dev hiện đại thường dùng:

```css
* {
  box-sizing: border-box;
}
```

        /* # 94. Box model – Padding (Part 1)

**Padding** là khoảng **không gian bên trong** giữa **content** và **border** trong CSS Box Model. 📦

```
+---------------------------+
|        border             |
|   +-------------------+   |
|   |     padding       |   |
|   |   +-----------+   |   |
|   |   | content   |   |   |
|   |   +-----------+   |   |
|   +-------------------+   |
+---------------------------+
```

---

## Padding là gì?

* Tạo khoảng cách **bên trong box**
* Đẩy content **ra xa border**
* Không làm tách element khỏi element khác (đó là margin)

```css
.box {
  padding: 20px;
}
```

---

## Padding 1 giá trị

👉 Áp dụng cho **tất cả các cạnh**

```css
.box {
  padding: 20px;
}
```

Tương đương:

```css
.box {
  padding-top: 20px;
  padding-right: 20px;
  padding-bottom: 20px;
  padding-left: 20px;
}
```

---

## Padding theo từng cạnh

```css
.box {
  padding-top: 10px;
  padding-right: 20px;
  padding-bottom: 30px;
  padding-left: 40px;
}
```

---

## Padding 2 giá trị

👉 `vertical | horizontal`

```css
.box {
  padding: 10px 20px;
}
```

* top + bottom = 10px
* left + right = 20px

---

## Padding 3 giá trị

👉 `top | horizontal | bottom`

```css
.box {
  padding: 10px 20px 30px;
}
```

* top = 10px
* left + right = 20px
* bottom = 30px

---

## Padding 4 giá trị (clockwise)

👉 `top right bottom left`

```css
.box {
  padding: 10px 20px 30px 40px;
}
```

🕒 theo chiều kim đồng hồ

```
   top
left   right
  bottom
```

---

## Padding ảnh hưởng đến size box

Mặc định:

```
total width = width + padding + border
```

```css
.box {
  width: 200px;
  padding: 20px;
}
```

👉 width thực = **240px**

---

## Padding dùng với background

Padding **ăn background**

```css
.box {
  background: lightblue;
  padding: 20px;
}
```

Background sẽ phủ cả vùng padding 🎨

---

## Khi nào dùng padding?

* Tạo khoảng cách text trong button
* Card UI spacing
* Navbar spacing
* Form input spacing

Ví dụ button:

```css
button {
  padding: 10px 20px;
}
```

---

## So sánh nhanh padding vs margin

| padding             | margin              |
| ------------------- | ------------------- |
| bên trong           | bên ngoài           |
| ăn background       | không ăn background |
| tăng kích thước box | không               |

---
