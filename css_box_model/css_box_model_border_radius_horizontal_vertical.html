        /* # 100. `border-radius` – Horizontal / Vertical values

`border-radius` không chỉ nhận **1 giá trị**, mà còn có thể nhận **horizontal / vertical** để tạo bo góc **ellipse** thay vì hình tròn.

Cú pháp:

```css
border-radius: horizontal / vertical;
```

---

## Ví dụ cơ bản

```css
.box {
  border-radius: 50px / 20px;
}
```

👉 nghĩa là:

* horizontal radius = 50px
* vertical radius = 20px

Kết quả: góc bo **dẹt theo chiều dọc** 🥚

---

## Minh họa

```
border-radius: 50px;
```

→ bo tròn đều ⚪

```
border-radius: 50px / 20px;
```

→ bo ellipse

---

## 4 góc với horizontal / vertical

Bạn có thể truyền **4 giá trị trước dấu /** và **4 giá trị sau dấu /**

```css
.box {
  border-radius: 10px 20px 30px 40px / 5px 15px 25px 35px;
}
```

👉 tương đương

| Góc          | Horizontal | Vertical |
| ------------ | ---------- | -------- |
| top-left     | 10px       | 5px      |
| top-right    | 20px       | 15px     |
| bottom-right | 30px       | 25px     |
| bottom-left  | 40px       | 35px     |

---

## Ví dụ shape blob

```css
.blob {
  border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
}
```

👉 tạo shape organic 🎨

---

## Dùng cho avatar ellipse

```css
.avatar {
  width: 150px;
  height: 100px;
  border-radius: 50% / 50%;
}
```

---

## Khi nào dùng

* blob UI
* organic shapes
* custom card
* fancy buttons
* image crop ellipse

---

## So sánh

| Cú pháp                            | Kết quả      |
| ---------------------------------- | ------------ |
| `border-radius: 20px;`             | tròn đều     |
| `border-radius: 50%;`              | hình tròn    |
| `border-radius: 50px / 20px;`      | ellipse      |
| `border-radius: a b c d / e f g h` | custom shape |

---

## Ghi nhớ nhanh

* `/` → tách horizontal và vertical
* trước `/` → chiều ngang
* sau `/` → chiều dọc
* dùng để tạo ellipse 🎯
