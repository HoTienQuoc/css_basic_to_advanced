        /* **86. `display` — inline, inline-block, block, …** điều khiển **cách phần tử hiển thị và chiếm không gian** trên trang. 📦

---

## 🔹 `display: block`

* Chiếm **toàn bộ chiều ngang**
* Luôn xuống dòng mới
* Có thể set `width`, `height`, `margin`, `padding`

```css
div {
  display: block;
}
```

**Ví dụ**

```html
<div>Block 1</div>
<div>Block 2</div>
```

👉 Hiển thị mỗi dòng một phần tử

**Default block elements**

* `div`, `p`, `h1-h6`, `section`, `article` 📚

---

## 🔹 `display: inline`

* Không xuống dòng
* Chiều rộng = nội dung
* ❌ Không set được `width`, `height`
* `margin-top/bottom` không có tác dụng

```css
span {
  display: inline;
}
```

**Ví dụ**

```html
<span>Inline 1</span>
<span>Inline 2</span>
```

👉 Nằm cùng một dòng

**Default inline elements**

* `span`, `a`, `strong`, `em` ✏️

---

## 🔹 `display: inline-block`

👉 Lai giữa `inline` + `block`

* Nằm cùng dòng như inline
* Nhưng set được `width`, `height`
* Có margin/padding đầy đủ

```css
.box {
  display: inline-block;
  width: 100px;
  height: 100px;
}
```

---

## 🔹 So sánh nhanh

| display      | xuống dòng | set width/height | margin top/bottom |
| ------------ | ---------- | ---------------- | ----------------- |
| block        | ✅          | ✅                | ✅                 |
| inline       | ❌          | ❌                | ❌                 |
| inline-block | ❌          | ✅                | ✅                 |

---

## 🔹 Ví dụ trực quan

```html
<div class="block">block</div>
<span class="inline">inline</span>
<span class="inline">inline</span>
<div class="inline-block">inline-block</div>
<div class="inline-block">inline-block</div>
```

```css
.block {
  display: block;
  background: lightblue;
}

.inline {
  display: inline;
  background: pink;
}

.inline-block {
  display: inline-block;
  width: 100px;
  background: lightgreen;
}
```

---

/*
```

## 🔹 `display: none`

```css
.hidden {
  display: none;
}
```

👉 Phần tử biến mất hoàn toàn (không chiếm chỗ) 🚫

---

* block = dòng riêng 📏
* inline = cùng dòng ✏️
* inline-block = cùng dòng nhưng control được 📦
