<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Css video columns gallery</title>
        <style>
            body {
                margin: 0;
            }
            * {
                box-sizing: border-box;
            }
            /* Column container */
            .column-container {
                padding: 20px;
                overflow: auto;
            }
            .text {
                font-size: 18px;
                font-weight: 800;
            }
            /* padding for each column */
            .pad {
                padding: 15px;
            }
            /* styling for image column */
            img,
            video {
                width: 100%;
            }
            /* Effect for each column */
            /* colors */
            .color1 {
                background-color: darkorange;
            }
            .color2 {
                background-color: turquoise;
            }
            .color3 {
                background-color: blueviolet;
            }
            .color4 {
                background-color: darkgreen;
            }
            .color5 {
                background-color: yellow;
            }
            /*  */
            .col-1-2 {
                float: left;
                width: 50%;
                /* 1/2 column */
            }
            .col-1-3 {
                float: left;
                width: 33.33%;
                /* 1/3 column */
            }
            .col-1-4 {
                float: left;
                width: 25%;
                /* 1/4 column */
            }
            .col-1-5 {
                float: left;
                width: 20%;
                /* 1/5 column */
            }
            .col-1-6 {
                float: left;
                width: 16.66%;
                /* 1/6 column */
            }
            .col-3-4 {
                float: left;
                width: 75%;
                /* 3/4 column */
            }
            /* Effect for column */
            .effect {
                border-radius: 40px;
                box-shadow: 4px 5px 5px 7px gray;
            }
            /* Responsiveness of the columns */
            @media screen and (max-width: 650px) {
                [class*="col-"] {
                    float: none;
                    display: block;
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <section class="column-container color1">
            <h3>Nested video in columns</h3>
            <div class="col-3-4 pad color2 effect">
                <h3>1/3 videos nested in 3/4 column</h3>
                <div class="col-1-3">
                    <video
                        src="videos/2278095-hd_1920_1080_30fps.mp4"
                        controls
                    ></video>
                </div>
                <div class="col-1-3">
                    <video
                        src="videos/2887463-hd_1920_1080_25fps.mp4"
                        controls
                    ></video>
                </div>
                <div class="col-1-3">
                    <video
                        src="videos/5377521-uhd_3840_2160_25fps.mp4"
                        controls
                    ></video>
                </div>
            </div>
        </section>
        <!-- 4 equal columns -->
        <section class="column-container color2">
            <h3>4 Equal column video/image gallery</h3>
            <div class="col-1-4 pad color3">
                <img src="images/image1.png" alt="" />
                <video
                    src="videos/2278095-hd_1920_1080_30fps.mp4"
                    controls
                ></video>
                <img src="images/image2.png" alt="" />
                <video
                    src="videos/2887463-hd_1920_1080_25fps.mp4"
                    controls
                ></video>
            </div>
            <div class="col-1-4 pad color4">
                <img src="images/image1.png" alt="" />
                <video
                    src="videos/2278095-hd_1920_1080_30fps.mp4"
                    controls
                ></video>
                <img src="images/image2.png" alt="" />
                <video
                    src="videos/2887463-hd_1920_1080_25fps.mp4"
                    controls
                ></video>
            </div>
        </section>
    </body>
</html>
