<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Css nesting column inside column</title>
        <style>
            body {
                margin: 0;
            }
            * {
                box-sizing: border-box;
            } /* Column container */
            .column-container-space {
                padding: 20px 0 20px 20px;
                overflow: auto;
            }
            .text {
                font-size: 18px;
                font-weight: 800;
            } /* padding for each column */
            .pad-space {
                padding: 15px;
                margin-right: 1.5%;
            }
            /* styling for image column */
            img,
            video {
                width: 100%;
            }
            /* Effect for each column */
            /* colors */
            .color1 {
                background-color: darkorange;
            }
            .color2 {
                background-color: turquoise;
            }
            .color3 {
                background-color: blueviolet;
            }
            .color4 {
                background-color: darkgreen;
            }
            .color5 {
                background-color: yellow;
            }
            .color6 {
                background-color: tomato;
            }
            /* */
            .col-1-2 {
                float: left;
                width: 48.5%; /* 1/2 column */
            }
            .col-1-3 {
                float: left;
                width: 31.83%; /* 1/3 column */
            }
            .col-1-4 {
                float: left;
                width: 23.5%; /* 1/4 column */
            }
            .col-1-5 {
                float: left;
                width: 18.5%; /* 1/5 column */
            }
            .col-1-6 {
                float: left;
                width: 15.16%;
                /* 1/6 column */
            }
            .col-3-4 {
                float: left;
                width: 75%; /* 3/4 column */
            }
            /* Effect for column */
            .effect {
                border-radius: 40px;
                box-shadow: 4px 5px 5px 7px gray;
            }
            /* unequal columns */
            .col-1 {
                float: left;
                width: 98.5%;
            }
            .col-2-3 {
                float: left;
                width: 66.16%;
            }
            .col-3-4 {
                float: left;
                width: 73.5%;
            }
            .col-4-5 {
                float: left;
                width: 78.5%;
            }
            .col-5-6 {
                float: left;
                width: 81.83%;
            }
            .col-3-5 {
                float: left;
                width: 58.5%;
            }
            .col-2-5 {
                float: left;
                width: 38.5%;
            }
            /* Responsiveness of the columns */
            @media screen and (max-width: 768px) {
                [class*="col-"] {
                    float: none;
                    display: block;
                    width: 100%;
                }
                .column-container-space {
                    padding-right: 20px;
                }
                .pad-space {
                    margin-right: 0;
                }
            }
        </style>
    </head>
    <body>
        <section class="column-container-space color1">
            <h3>Nesting column inside column</h3>
            <div class="col-1-3 pad-space color2">
                <div class="col-1-3 pad-space color3">
                    <div class="col-1-3 pad-space color4">
                        <div class="col-1-3 pad-space color5">
                            <div class="col-1-3 pad-space color6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
