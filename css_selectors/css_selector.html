<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Type selectors is targeting the element directly */
        section{
            color: darkblue;
            font-size: 45px;
        }
        cite{
            color: crimson;
            font-size: 20px;
        }
        ul{
            color: chocolate;
            font-size: 60px;
        }
        /* Class Selectors is targeting the class created in the element */
        .a{
            font-size: 70px;
            text-decoration: overline double;
        }
        .dream{
            text-decoration: underline wavy;
            color: crimson;
        }
        /* Identifier selectors is targeting the id created in the element */
        #fun{
            text-align: center;
            text-shadow: 4px 2px 10px red;
        }
    </style>
</head>
<body>
    <section>
        <p>Awesome</p>
        <h2 class="a">Dreams</h2>
        <cite>Dance</cite>
        <q class="dream">Winning</q>
        <ul>
            <li>Dress up</li>
            <li>Go to work</li>
        </ul>
        <div id="fun">
            Fantastic
        </div>
    </section>
</body>
</html>
