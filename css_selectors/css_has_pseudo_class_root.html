        /* **76. Application of `:has()` with `:root` element** dùng để **thay đổi toàn bộ document dựa trên trạng thái của phần tử con** — cực kỳ mạnh cho **theme switcher, global state**. 🌍

---

## 🔹 Ý tưởng chính

`:root` đại diện cho **toàn bộ document (`html`)**.
Khi kết hợp với `:has()` → bạn có thể **style toàn trang dựa trên điều kiện bên trong**.

```css
:root:has(selector) {
  /* global styles */
  /*
}
```

---

## 🔹 Ví dụ Dark Mode không cần JavaScript 🌙

```html
<label>
  <input type="checkbox" id="dark">
  Dark mode
</label>
```

```css
:root:has(#dark:checked) {
  background: #111;
  color: white;
}
```

👉 Khi checkbox được check → toàn bộ trang chuyển dark mode

---

## 🔹 Ví dụ với CSS variables (best practice)

```css
:root {
  --bg: white;
  --text: black;
}

:root:has(#dark:checked) {
  --bg: #111;
  --text: white;
}

body {
  background: var(--bg);
  color: var(--text);
}
```

👉 Toggle theme mượt hơn 🎛️

---

## 🔹 Auto change layout khi có modal

```css
:root:has(.modal.open) {
  overflow: hidden;
}
```

👉 Khi modal mở → disable scroll toàn trang

---

## 🔹 Menu active toàn site

```css
:root:has(nav .active) {
  --nav-color: red;
}
```

---

## 🔹 So sánh cách cũ vs mới

| Cách cũ          | Cách mới      |
| ---------------- | ------------- |
| JS toggle class  | `:root:has()` |
| body.dark        | tự detect     |
| add/remove class | CSS tự động   |
