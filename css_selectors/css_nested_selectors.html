        /* **77. Nested selector** là cách **lồng selector bên trong selector khác** để viết CSS **ngắn gọn và dễ đọc hơn** — giống như trong SCSS nhưng **CSS hiện đại đã hỗ trợ native nesting**. 🧩

---

## 🔹 Cú pháp cơ bản (CSS Nesting)

```css
.parent {
  color: black;

  .child {
    color: red;
  }
}
```

👉 Tương đương:

```css
.parent { color: black; }
.parent .child { color: red; }
```

---

## 🔹 Ví dụ thực tế

```css
.card {
  padding: 20px;
  background: white;

  h3 {
    margin-bottom: 10px;
  }

  p {
    color: gray;
  }
}
```

👉 Không cần viết `.card h3`, `.card p` nữa.

---

## 🔹 Nested với pseudo class

```css
.button {
  background: blue;

  &:hover {
    background: darkblue;
  }
}
```

👉 `&` đại diện cho selector cha

Tương đương:

```css
.button:hover {
  background: darkblue;
}
```

---

## 🔹 Nested nhiều cấp

```css
nav {
  ul {
    li {
      a {
        color: black;
      }
    }
  }
}
```

👉 tương đương:

```css
nav ul li a {
  color: black;
}
```

---

## 🔹 Nested với modifier (BEM style)

```css
.card {
  padding: 20px;

  &.active {
    border: 2px solid red;
  }

  &__title {
    font-weight: bold;
  }
}
```

---

## 🔹 Kết hợp với `:has()`

```css
.card {
  &:has(img) {
    border: 1px solid green;
  }
}
```

---

## 🔹 So sánh trước và sau

### ❌ CSS cũ

```css
.nav {}
.nav ul {}
.nav ul li {}
.nav ul li a {}
```

### ✅ Nested CSS

```css
.nav {
  ul {
    li {
      a {}
    }
  }
}
```

---

## ⚠️ Lưu ý

* CSS nesting **đã hỗ trợ** trên Chrome, Edge, Safari mới 🟢
* Firefox hỗ trợ bản mới 🟡
* Không cần SCSS nữa trong nhiều trường hợp

---

## 🔥 Best practice

```css
.card {
  padding: 20px;

  &:hover { }

  img { }

  .title { }

  .desc { }
}
```
