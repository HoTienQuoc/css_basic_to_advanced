<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grouping Combining Selectors</title>
    <style>
        /* Type selectors is targeting the element directly */
        section{
            color: darkblue;
            font-size: 45px;
        }
        cite{
            color: crimson;
            font-size: 20px;
        }
        ul{
            color: chocolate;
            font-size: 60px;
        }
        /* Class Selectors is targeting the class created in the element */
        .a{
            font-size: 70px;
            text-decoration: overline double;
        }
        .dream{
            text-decoration: underline wavy;
            color: crimson;
        }
        /* Identifier selectors is targeting the id created in the element */
        #fun{
            text-align: center;
            text-shadow: 4px 2px 10px red;
            font-size: 40px;
        }

        aside{
            color: lightseagreen;
            font-size: 70px;
        }

        /* Grouping Selectors */
        /* "," is Grouping Selectors */
        p, q, div{
            color: fuchsia;
            font-size: 20px;
        }

        .b, .c, .d{
            text-decoration: overline double;
            color: chartreuse;
        }

        /* Combining Selectors */
        /* "," is Grouping Selectors */
        aside ul{
            color: rebeccapurple;
            font-size: 60px;
        }
        aside .e{
            color: red;
            font-size: 20px;
        }
        .b .d{
            color: brown;
        }
        ul .f{
            color: brown;
        }
        .tell .cool{
            color: darkcyan;
            text-shadow: 5px 4px 10px green;
            font-size: 70px;
        }
    </style>
</head>
<body>
    <section>
        <p>Awesome</p>
        <h2 class="a">Dreams</h2>
        <cite>Dance</cite>
        <q class="dream">Winning</q>
        <ul>
            <li>Dress up</li>
            <li>Go to work</li>
        </ul>
        <div id="fun">
            Fantastic
        </div>
    </section>
    <aside>
        <p>Awesome</p>
        <h2 class="b">Dreams</h2>
        <cite class="d">Dance</cite>
        <q class="c">Winning</q>
        <ul>
            <li class="f">Dress up</li>
            <li>Go to work</li>
        </ul>
        <p class="e">Climbing</p>
        <div class="tell">
            <p class="cool">Shine</p> Fantastic
        </div>
    </aside>
</body>
</html>
