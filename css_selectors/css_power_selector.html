<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Selector</title>
    <!-- Comparing the power of the id, class and type selectors -->
    <style>
        #b{
            color: goldenrod;
            font-size: 20rem;
            text-decoration: line-through solid;
        }
        .a{
            color: purple;
            font-size: 90px;
            text-decoration: underline dashed;
        }
        section{
            color: crimson;
            font-size: 240px;
            text-decoration: overline solid;
        }
    </style>
</head>
<body>
    <section class="a" id="b">
        <p>Dreams</p>
    </section>
</body>
</html>
