<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merging-selectors</title>
    <style>
        #purple{
            font-size: 90px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: purple;
        }

        /* Merging selector */
        h2#purple{
            color: teal;
        }
        #purple.red{
            color: red;
            font-size: 10rem;
        }
    </style>
</head>
<body>
    <h1 id="purple">Awesomeness</h1>
    <h2 id="purple" class="teal">Greatness</h2>
    <h2 id="purple" class="red">You rock</h2>
</body>
</html>
