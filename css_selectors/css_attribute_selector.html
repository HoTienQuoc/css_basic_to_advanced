        /* **Attribute selectors – present, equals, contains** là 3 kiểu chọn phần tử theo **thuộc tính HTML** trong CSS 🎯

---

## 1. Present — `[attr]`

Chọn phần tử **có attribute**, không cần giá trị

```css
input[required] {
  border: 1px solid red;
}
```

➡️ tất cả `input` có `required`

---

## 2. Equals — `[attr=value]`

Chọn phần tử có **giá trị chính xác**

```css
input[type="text"] {
  background: #eee;
}
```

➡️ chỉ `type="text"`

---

## 3. Contains — `[attr*=value]`

Chọn phần tử có **chuỗi chứa giá trị**

```css
a[href*="google"] {
  color: green;
}
```

➡️ `href` chứa `"google"`

---

## Tóm tắt nhanh 🧠

| Loại     | Selector        | Ý nghĩa        |
| -------- | --------------- | -------------- |
| Present  | `[attr]`        | có attribute   |
| Equals   | `[attr=value]`  | bằng chính xác |
| Contains | `[attr*=value]` | chứa chuỗi     |

Ví dụ nhanh:

```css
img[alt] { }          /* present */

input[type="email"] { } /* equals */

      /* **73. Attribute selectors – begins with & ends with** trong CSS dùng để chọn phần tử dựa trên **giá trị thuộc tính bắt đầu hoặc kết thúc bằng chuỗi nào đó**.

---

## 🔹 Begins with (`^=`)

Chọn phần tử có **giá trị thuộc tính bắt đầu bằng** chuỗi chỉ định.

**Syntax**

```css
[attribute^="value"] {
  /* styles */
  /*
}
```

**Ví dụ**

```html
<a href="https://google.com">Google</a>
<a href="https://youtube.com">YouTube</a>
<a href="http://example.com">Example</a>
```

```css
a[href^="https"] {
  color: green;
}
```

👉 Chỉ các link bắt đầu bằng `https` sẽ có màu xanh.

---

## 🔹 Ends with (`$=`)

Chọn phần tử có **giá trị thuộc tính kết thúc bằng** chuỗi chỉ định.

**Syntax**

```css
[attribute$="value"] {
  /* styles */
  /*
}
```

**Ví dụ**

```html
<img src="photo.jpg">
<img src="icon.png">
<img src="banner.jpg">
```

```css
img[src$=".jpg"] {
  border: 2px solid red;
}
```

👉 Chỉ ảnh `.jpg` có viền đỏ.

---

## 🔹 Ví dụ kết hợp thực tế

```html
<input type="email">
<input type="text">
<input type="password">
```

```css
input[type^="pa"] {
  background: #ffe0e0;
}
```

👉 Chỉ `password` bị chọn.

---

## 🔹 So sánh nhanh

| Selector        | Ý nghĩa           |
| --------------- | ----------------- |
| `[attr^="val"]` | Bắt đầu bằng      |
| `[attr$="val"]` | Kết thúc bằng     |
| `[attr*="val"]` | Chứa ở bất kỳ đâu |

---

      /* **74. Attribute selectors – includes (`~=`) và hyphenated (`|=`)** dùng để chọn phần tử theo **từng từ riêng biệt** hoặc **giá trị có tiền tố kèm dấu gạch ngang**.

---

## 🔹 Includes (`~=`) — chứa **từ riêng biệt**

Chọn phần tử có **giá trị thuộc tính chứa một từ chính xác** (cách nhau bằng dấu cách).

**Syntax**

```css
[attribute~="value"] {
  /* styles */
 /* 
}
```

**Ví dụ**

```html
<p class="btn primary large">Button</p>
<p class="btn secondary">Button</p>
<p class="primary-btn">Button</p>
```

```css
[class~="primary"] {
  color: red;
}
```

👉 Chỉ phần tử có **từ "primary" riêng biệt** được chọn

* ✅ `"btn primary large"`
* ❌ `"primary-btn"` (không phải từ riêng)

📌 Hay dùng cho class chứa nhiều giá trị.

---

## 🔹 Hyphenated (`|=`) — bắt đầu bằng + dấu `-`

Chọn phần tử có giá trị:

* đúng bằng value
* hoặc bắt đầu bằng `value-`

**Syntax**

```css
[attribute|="value"] {
  /* styles */
  /*
}
```

**Ví dụ**

```html
<p lang="en">English</p>
<p lang="en-US">American English</p>
<p lang="en-GB">British English</p>
<p lang="fr">French</p>
```

```css
[lang|="en"] {
  font-weight: bold;
}
```

👉 Sẽ chọn:

* ✅ `en`
* ✅ `en-US`
* ✅ `en-GB`
* ❌ `fr`

📌 Thường dùng cho `lang`, version prefix, namespace.

---

## 🔹 So sánh nhanh

| Selector        | Ý nghĩa                |                               |
| --------------- | ---------------------- | ----------------------------- |
| `[attr~="val"]` | chứa **từ riêng biệt** |                               |
| `[attr          | ="val"]`               | bằng hoặc bắt đầu bằng `val-` |
| `[attr*="val"]` | chứa bất kỳ đâu        |                               |
| `[attr^="val"]` | bắt đầu bằng           |                               |
| `[attr$="val"]` | kết thúc bằng          |                               |

---
