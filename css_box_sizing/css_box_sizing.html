---

## 🧠 Mặc định (content-box)

Theo mặc định, CSS dùng `box-sizing: content-box`.

👉 `width` và `height` **chỉ tính phần content**, không bao gồm `padding` và `border`.

```css
.box {
  width: 200px;
  padding: 20px;
  border: 5px solid black;
}
```

📏 Kích thước thực tế:

* width thực = 200 + 20 + 20 + 5 + 5 = **250px**
* layout dễ bị "phình" ngoài ý muốn 😵

---

## 💡 border-box (được dùng nhiều nhất)

```css
.box {
  box-sizing: border-box;
  width: 200px;
  padding: 20px;
  border: 5px solid black;
}
```

👉 `width = 200px` **đã bao gồm padding + border**

📏 Kích thước thực:

* width thực = **200px (không đổi)**
* content tự co lại để chứa padding + border

👍 Dễ layout hơn
👍 Không bị vỡ grid
👍 Responsive tốt hơn

---

## 📊 So sánh nhanh

| box-sizing  | width tính gì              | dễ layout |
| ----------- | -------------------------- | --------- |
| content-box | chỉ content                | ❌         |
| border-box  | content + padding + border | ✅         |

---

## 🌍 Best Practice (dùng toàn project)

Dev thường reset toàn bộ:

```css
*,
*::before,
*::after {
  box-sizing: border-box;
}
```

👉 Giúp layout ổn định toàn bộ website

---

## Ví dụ trực quan

```css
.container {
  width: 300px;
  border: 2px solid red;
}

.box {
  width: 100%;
  padding: 20px;
  border: 10px solid blue;
  box-sizing: border-box;
}
```

👉 `.box` vẫn nằm gọn trong `.container` 😎

---

## Khi nào dùng content-box?

Hầu như **không dùng** nữa, trừ khi:

* cần tính toán thủ công
* làm animation đặc biệt

---

## Ghi nhớ nhanh 🧠

* `content-box` → width không bao gồm padding, border
* `border-box` → width bao gồm tất cả
* luôn reset `box-sizing: border-box`

# 🎯 Ví dụ CSS

```css
.box {
  width: 200px;
  height: 100px;
  padding: 20px;
  border: 10px solid black;
  margin: 30px;
}
```

---

# 1️⃣ Khi dùng `content-box` (mặc định)

## 📏 Tính WIDTH

* width = 200
* padding trái + phải = 40
* border trái + phải = 20
* margin trái + phải = 60

👉 Tổng width:

```
30 + 10 + 20 + 200 + 20 + 10 + 30 = 320px
```

👉 Box chiếm **320px ngang**

---

## 📐 Tính HEIGHT

* height = 100
* padding trên + dưới = 40
* border trên + dưới = 20
* margin trên + dưới = 60

👉 Tổng height:

```
30 + 10 + 20 + 100 + 20 + 10 + 30 = 220px
```

👉 Box chiếm **220px dọc**

---

# 2️⃣ Khi dùng `border-box`

```css
.box {
  box-sizing: border-box;
}
```

## 📏 WIDTH

* width = 200 (đã gồm padding + border)
* margin trái + phải = 60

👉 Tổng width:

```
30 + 200 + 30 = 260px
```

---

## 📐 HEIGHT

* height = 100 (đã gồm padding + border)
* margin trên + dưới = 60

👉 Tổng height:

```
30 + 100 + 30 = 160px
```

---

# 🔥 So sánh trực tiếp

|                   | content-box | border-box |
| ----------------- | ----------- | ---------- |
| width chiếm       | 320px       | 260px      |
| height chiếm      | 220px       | 160px      |
| padding cộng thêm | ✅           | ❌          |
| border cộng thêm  | ✅           | ❌          |
| margin cộng thêm  | ✅           | ✅          |

---

# 📦 Hình dung

content-box

```
margin
 └ border
    └ padding
       └ content
```

border-box

```
margin
 └ width (đã gồm border + padding + content)
```

---

# 🧠 Công thức nhớ nhanh

### content-box

```
total = margin + border + padding + width/height + padding + border + margin
```

### border-box

```
total = margin + width/height + margin
```

 /* **110. Importance of setting `box-sizing: border-box`** 📦✨
(Ý nghĩa của việc luôn đặt `border-box`)

---

## 🎯 Vì sao nên dùng `border-box`

Khi dùng:

```css
*,
*::before,
*::after {
  box-sizing: border-box;
}
```

👉 giúp **dễ kiểm soát layout** hơn rất nhiều.

---

## 1️⃣ Không bị vỡ layout 😵

Không cần tính thêm padding + border.

### Ví dụ

```css
.container {
  width: 300px;
}

.box {
  width: 100%;
  padding: 20px;
  border: 10px solid;
}
```

* `content-box` → box sẽ **tràn ra ngoài**
* `border-box` → box vẫn **nằm gọn bên trong** 😎

---

## 2️⃣ Responsive dễ hơn 📱

Khi làm responsive, width `%` sẽ **không bị phình**.

👉 `width: 50%` luôn đúng 50%
👉 không bị cộng padding thêm

---

## 3️⃣ Không cần tính toán phức tạp 🧠

Không cần:

```
width - padding - border
```

Chỉ cần:

```
width = kích thước thật
```

---

## 4️⃣ Grid / Flex ổn định hơn 🎯

Khi chia layout:

```css
.col {
  width: 33.33%;
  padding: 10px;
}
```

* content-box → bị xuống dòng
* border-box → luôn nằm đúng hàng

---

## 5️⃣ Chuẩn được dùng trong hầu hết project 🚀

Gần như **mọi framework** đều reset:

* Bootstrap
* Tailwind
* Normalize.css
* Modern CSS reset

---

## 🧠 Tóm lại

`border-box` giúp:

* 📏 width đúng như khai báo
* 🧱 layout không vỡ
* 📱 responsive dễ
* 🧠 ít phải tính toán
* 🚀 code sạch hơn

---

## Quy tắc nên dùng luôn

```css
*,
*::before,
*::after {
  box-sizing: border-box;
}
```

👉 Đây là **best practice chuẩn hiện nay**

---

Nhớ câu này:
👉 **border-box = layout ổn định**
👉 **content-box = dễ vỡ layout**
