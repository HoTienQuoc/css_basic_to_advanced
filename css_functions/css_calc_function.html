---

## 📘 Câu gốc

> The calc() CSS function lets you perform calculations when specifying CSS property values. It can be used with `<length>`, `<frequency>`, `<angle>`, `<time>`, `<percentage>`, `<number>`, `<integer>`, and `<color-function>` values.

---

## ✅ Dịch dễ hiểu

**Hàm `calc()` cho phép bạn thực hiện các phép tính khi đặt giá trị cho thuộc tính CSS. Nó có thể dùng với các kiểu giá trị như chiều dài, phần trăm, thời gian, góc, số, màu…** 🧮

---

## Ý chính

`calc()` = **CSS calculator**
Bạn có thể:

* cộng ➕
* trừ ➖
* nhân ✖️
* chia ➗

---

## Các loại giá trị dùng được

### 1. `<length>` 📏

```css
width: calc(100% - 50px);
margin-top: calc(10px + 2rem);
```

---

### 2. `<percentage>` %

```css
width: calc(50% - 20px);
```

---

### 3. `<angle>` 🔄

```css
transform: rotate(calc(45deg + 15deg));
```

---

### 4. `<time>` ⏱️

```css
animation-delay: calc(1s + 200ms);
```

---

### 5. `<number>`

```css
line-height: calc(1.2 + 0.3);
```

---

### 6. `<integer>`

```css
z-index: calc(10 + 5);
```

---

### 7. `<frequency>` (ít dùng)

```css
/* hiếm khi dùng */
/*```

---

### 8. `<color-function>` 🎨

Có thể dùng trong color functions mới

```css
color: rgb(calc(255 - 100) 0 0);
```

---

## Ví dụ phổ biến nhất

```css
.container {
  width: calc(100% - 40px);
}
```

👉 Chiều rộng = toàn bộ màn hình trừ 40px

---

## ⚠️ Quy tắc quan trọng

Phải có **space giữa toán tử**

```css
calc(100% - 20px); ✅
calc(100%-20px);   ❌
```

---

## Tóm tắt nhanh 🧠

* `calc()` = tính toán trong CSS
* dùng với px, %, deg, s…
* phải có khoảng trắng quanh `+ - * /`

---

Ví dụ thực tế hay dùng nhất:

```css
height: calc(100vh - 60px);
```
