---

## 🔹 Cú pháp

```css
vertical-align: baseline | top | middle | bottom | text-top | text-bottom | px | %;
```

---

## Ví dụ cơ bản

```html
<p>
  Hello 
  <img src="avatar.png" class="icon">
  World
</p>
```

```css
.icon {
  width: 40px;
  vertical-align: middle;
}
```

👉 Ảnh sẽ **căn giữa theo chiều dọc** so với text.

---

## Các giá trị thường dùng

### 1. `baseline` (mặc định)

Căn theo **đường chân chữ**

```css
vertical-align: baseline;
```

---

### 2. `top`

Căn lên trên cùng

```css
vertical-align: top;
```

---

### 3. `middle` ⭐ (hay dùng)

Căn giữa theo chiều dọc

```css
vertical-align: middle;
```

---

### 4. `bottom`

Căn xuống dưới

```css
vertical-align: bottom;
```

---

## Ví dụ trực quan

```html
<span class="box box1"></span>
<span class="box box2"></span>
<span class="box box3"></span>
```

```css
.box {
  display: inline-block;
  width: 40px;
  height: 40px;
  background: orange;
}

.box1 { vertical-align: top; }
.box2 { vertical-align: middle; }
.box3 { vertical-align: bottom; }
```

👉 Bạn sẽ thấy 3 box **lệch nhau theo chiều dọc**.

---

## ⚠️ Quan trọng

`vertical-align` **KHÔNG hoạt động với block element**

```css
div {
  vertical-align: middle; ❌ không có tác dụng
}
```

Chỉ dùng cho:

* inline
* inline-block
* table-cell
* img

---

## Trick căn giữa icon + text

```html
<button>
  <img src="icon.svg">
  Download
</button>
```

```css
button img {
  vertical-align: middle;
}
```

---

## Tóm tắt nhanh 🧠

* dùng để **căn dọc inline elements**
* hay dùng: `middle`
* không dùng cho `display: block`
* rất hữu ích với `img + text`

---

## 📌 Câu gốc

> The text-align CSS property sets the horizontal alignment of the inline-level content inside a block element or table-cell box. This means it works like vertical-align but in the horizontal direction.

---

## ✅ Dịch dễ hiểu

**`text-align` dùng để căn chỉnh theo chiều ngang nội dung inline bên trong một phần tử block hoặc table-cell. Nó giống `vertical-align` nhưng theo chiều ngang.** ↔️

---

## So sánh trực quan

| Thuộc tính       | Hướng | Dùng để căn |
| ---------------- | ----- | ----------- |
| `vertical-align` | ⬆️⬇️  | căn dọc     |
| `text-align`     | ⬅️➡️  | căn ngang   |

---

## Ví dụ `text-align`

```html
<div class="box">
  Hello world
</div>
```

```css
.box {
  text-align: center;
  border: 1px solid black;
}
```

👉 Text nằm **giữa theo chiều ngang**

---

## ⚠️ Quan trọng

`text-align` **không căn chính block element**, nó chỉ căn **inline content bên trong**

Sai ❌

```css

  text-align: center; /* không làm div nằm giữa */
  /*
}
```

Đúng ✅

}
```

```

---

## Tóm tắt nhanh 🧠

* `text-align` → căn ngang ↔️
* `vertical-align` → căn dọc ↕️
* `text-align` áp dụng cho **nội dung inline bên trong block**
* hay dùng: `center`

---

Combo hay dùng nhất:

```css
text-align: center;
vertical-align: middle;
```
